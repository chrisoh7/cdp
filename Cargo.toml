[package]
name = "cdp"
version = "0.1.0"
edition = "2021"
default-run = "cdp"

[dependencies]
rayon = "1.10"
arrow = "56.2.0" 
parquet = "56.2.0"
duckdb = { version = "1.0", features = ["bundled"] }
anyhow = "1.0"
rand = "0.8"
rand_distr = "0.4"
clap = { version = "4.5", features = ["derive"] }
chrono = "0.4.42"
tikv-jemallocator = { version = "0.6.1", optional = true }
dashmap = "6.1.0"
fnv = "1.0"
mimalloc = "0.1"

[features]
default = []
jemalloc = ["tikv-jemallocator"]
